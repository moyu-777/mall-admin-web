server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss image/svg+xml;

    # -------------------------------------------------------------------
    #  API 反代
    #
    #  config/prod.env.js 里把 BASE_API 设成了空字符串，于是 axios 走相对
    #  路径，请求打到本 nginx，由这里转发给 mall-admin 的 Service。
    #
    #  这么做的好处：
    #    1. 同源 → 不需要 CORS
    #    2. 前端产物里不硬编码任何 IP/域名 → 换环境不用重新构建
    #
    #  ⚠️ 前缀列表是从 src/api/*.js 里提取的。后端新增了一级路径，
    #     记得在这里同步补上，否则那个接口会 404（被下面的 SPA 兜底吃掉）。
    # -------------------------------------------------------------------
    location ~ ^/(admin|brand|companyAddress|coupon|couponHistory|flash|flashProductRelation|flashSession|home|memberLevel|menu|minio|order|orderSetting|prefrenceArea|product|productAttr|productAttrCate|productCate|productCategory|resource|resourceCategory|returnApply|returnReason|role|skuStock|subject|aliyun|oss)/ {
        # ★ 用 resolver + 变量的写法，而不是直接写域名，有两个原因：
        #   1. 直接写域名时 nginx 在【启动时】解析一次，解析失败就 emerg 退出
        #      → 如果 nginx 比 mall-admin 先起来，Pod 会 CrashLoopBackOff
        #   2. 解析结果会被永久缓存，Service 重建换 IP 后 nginx 还指着老地址
        #   改成变量后就是【每次请求时解析 + 缓存 10 秒】。
        #
        # ⚠️ resolver 这里必须写【IP】，不能写 kube-dns.kube-system.svc.cluster.local，
        #    因为 nginx 在加载配置时也会去解析 resolver 这个主机名，解析不到同样 emerg。
        #    查当前值：kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $mall_admin "http://mall-admin.mall.svc.cluster.local:8080";
        proxy_pass           $mall_admin$request_uri;

        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        client_max_body_size  20m;      # 商品图片上传
    }

    # -------------------------------------------------------------------
    #  SPA：Vue Router 用 history 模式，刷新子路由不能 404
    # -------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
